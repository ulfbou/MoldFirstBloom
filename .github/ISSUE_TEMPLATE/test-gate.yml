name: Release Gate
description: Definition of Done validation for a release gate
title: "[GATE] "
labels:
  - release-blocker
  - type:test

body:
  - type: textarea
    id: verification
    attributes:
      label: Verification Checklist
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Screenshots, test runs, videos, logs, links.

  - type: dropdown
    id: result
    attributes:
      label: Result
      options:
        - Pass
        - Fail
        - Blocked
    validations:
      required: true